function f4(){
        let parent=document.getElementById("box");
        let inp2=Number(document.getElementById("min").value);
        let inp3=Number(document.getElementById("max").value);
        let newbox = document.createElement("div");
        newbox.id = "inbox";
        let categoryDropdown = document.getElementById("category");
    let selectedCategory = categoryDropdown.value;
    parent.innerHTML = ""; 
    const filteredProducts = products.filter(p => {
        let categoryMatch = (selectedCategory === "" || p.category === selectedCategory); 
        let priceMatch = (p.price >= inp2 && p.price <= inp3); 
        return categoryMatch && priceMatch; 
    });

    
    if (filteredProducts.length > 0) { 
        filteredProducts.forEach(product => {
            let newbox = document.createElement("div"); // Create a new div for each product
            newbox.id = "inbox"; // You might want to assign a unique ID or class for styling/manipulation
            newbox.innerHTML = `
                <div id="inbox">
            <div id="imgbox">
                <img src="${product.thumbnail}" alt="${product.title}">
            </div>
            <h3>${product.title}</h3><span>$${product.price}</span>
            <h5>${product.category}</h5>
            </div>
            `; // Customize this based on your product object properties
            parent.appendChild(newbox); // Add the newbox to the parent element
        });
    } else {
        parent.innerHTML = "<p>No products found matching your criteria.</p>"; // Display a message if no products are found

}
