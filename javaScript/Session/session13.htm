<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Js_Session13</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <header >
        <nav class="navbar">
            <div class="logo">
                <h2>NiceHotel</h2>
                <i id="icbar" class="fa fa-bars" onclick="f1()"></i>
            </div>
            
            <div class="opt">
                <a href="">Home</a>
                <a href="">About</a>
                <a href="">Rooms</a>
                <a href="">Amenities</a>
                <a href="">Location</a>
                <a href="">Page</a>
                <a href="">Contact</a>
                <a href="">English</a>
            </div>
        </nav>
    </header>
    <section>

    </section>
    <section>

    </section>
    <section>

    </section>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        header{
            position: fixed;
            width: 100%;
            top: 0;
            padding: 30px;
            transition: all 1.5s ease;
        }
        .black{
            background-color: rgba(0, 0, 0, 0.689);
        }
        .navbar{
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo{
            margin-left: 20px;
            color: white;
            display: flex;
            justify-content: space-between;
        }
        .logo h2{
            font-size: 30px;
        }
        .navbar i{
            display: none;
        }
        .opt{
            margin-right: 20px;
        }
        .opt a{
            text-decoration: none;
            margin: 5px; 
            color: white;
        }
        
        @media screen and (max-width:800px) {
            .navbar{
                display: block;
            }
            .opt{
                display: none;
            }
            .opt a{
                display: block;
                text-align: center;
                align-items: center;
            }
            .navbar i{
                display: block;
                font-size: 25px;
            }
            .active{
            display: block;
            }
        }
        section{
            width: 100%;
            height: 100vh;
            background-color: aqua;
        }
    </style>
    <script>
        function f1(){
            var fun=document.querySelector(".opt");
            if(fun.display="none"){
            fun.style.display="block"
            }
            // document.querySelector(".opt").classList.toggle("active");
        }

        window.onscroll=function(){
            var h=document.querySelector("header");
            var a=document.documentElement.scrollTop;
            if(a>250){
                h.classList.add("black")
            }
            else{
                h.classList.remove("black")
            }
        }
    </script>
</body>
</html>
