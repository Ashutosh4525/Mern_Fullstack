function fun2() {
    let box = document.querySelector(".box");
    let sel = document.querySelector("#form").value;

    if (!sel) {
        alert("Please select an element type first!");
        return;
    }

    // Label input
    let labelInput = document.createElement("input");
    labelInput.type = "text";
    labelInput.placeholder = "Enter label name";

    // For options (only for select/checkbox/radio)
    let optionInput = null;
    let addOptionBtn = null;
    let optionList = []; // store options temporarily
    let optionPreview = null;

    if (sel === "select" || sel === "checkbox" || sel === "radio") {
        optionInput = document.createElement("input");
        optionInput.type = "text";
        optionInput.placeholder = "Enter option";

        addOptionBtn = document.createElement("button");
        addOptionBtn.textContent = "Add Option";

        optionPreview = document.createElement("ul");
        optionPreview.style.listStyle = "none";
        // optionPreview.style.padding = "5px";
        // optionPreview.style.margin = "5px 0";
    }

    // Done button
    let btn = document.createElement("button");
    btn.textContent = "Done";
    btn.classList.add("btn");

    // Close button
    let closeButton = document.createElement("button");
    closeButton.innerHTML = "&times;";
    closeButton.classList.add("clbtn");

    // Label element
    let newLabel = document.createElement("label");

    // Container
    let container = document.createElement("div");
    container.classList.add("newele");
    container.append(labelInput);
    if (optionInput) container.append(optionInput, addOptionBtn, optionPreview);
    container.append(btn, newLabel, closeButton);

    box.appendChild(container);

    // Close button → remove whole block
    closeButton.addEventListener("click", () => container.remove());

    // Add option handler
    if (addOptionBtn) {
        addOptionBtn.addEventListener("click", (e) => {
            e.preventDefault();
            let val = optionInput.value.trim();
            if (val) {
                optionList.push(val);

                // Show preview
                let li = document.createElement("li");
                li.textContent = val;

                // delete single option button
                let delBtn = document.createElement("button");
                delBtn.textContent = "x";
                delBtn.style.marginLeft = "10px";
                delBtn.addEventListener("click", () => {
                    optionList = optionList.filter(o => o !== val);
                    li.remove();
                });

                li.appendChild(delBtn);
                optionPreview.appendChild(li);

                optionInput.value = "";
            }
        });
    }

    // Done button → finalize
    btn.addEventListener("click", () => {
        let labelName = labelInput.value || "Unnamed";
        newLabel.textContent = labelName + ": ";

        // Clear temporary inputs
        labelInput.remove();
        btn.remove();
        if (optionInput) {
            optionInput.remove();
            addOptionBtn.remove();
            optionPreview.remove();
        }

        // Build final input based on type
        if (sel === "select") {
            let select = document.createElement("select");
            optionList.forEach(val => {
                let opt = document.createElement("option");
                opt.textContent = val;
                select.appendChild(opt);
            });
            container.innerHTML = "";
            container.append(newLabel, select, closeButton);

        } else if (sel === "checkbox") {
            container.innerHTML = "";
            container.append(newLabel);
            optionList.forEach(val => {
                let wrapper = document.createElement("div");
                let input = document.createElement("input");
                input.type = "checkbox";
                input.value = val;

                let optLabel = document.createElement("label");
                optLabel.textContent = val;

                wrapper.append(input, optLabel);
                container.appendChild(wrapper);
            });
            container.append(closeButton);

        } else if (sel === "radio") {
            container.innerHTML = "";
            container.append(newLabel);
            optionList.forEach(val => {
                let wrapper = document.createElement("div");
                let input = document.createElement("input");
                input.type = "radio";
                input.name = labelName; // grouped
                input.value = val;

                let optLabel = document.createElement("label");
                optLabel.textContent = val;

                wrapper.append(input, optLabel);
                container.appendChild(wrapper);
            });
            container.append(closeButton);

        } else if (sel === "submit") {
            let submitBtn = document.createElement("button");
            submitBtn.type = "submit";
            submitBtn.textContent = labelName || "Submit";
            container.innerHTML = "";
            container.append(newLabel, submitBtn, closeButton);

        } else {
            // Normal text/number/email
            let input = document.createElement("input");
            input.type = sel;
            container.innerHTML = "";
            container.append(newLabel, input, closeButton);
        }
    });
}
