<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
    <title>Form Creation</title>
</head>
<body>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Jersey 10", sans-serif;
        }
        h1{
            color: white;
        }
        #labe{
            outline-color: gold;
        }
        body{
            background-color: black;
        }
        .opti{
            margin: 20px;
            padding: 10px;  
        }
        #form{
            font-size: 20px;
        }
        .box{
            background-color: peru;
            width: 75%;
            margin: 10px auto;
            padding: 20px;
            border-radius: 10px;
        }
        .box h3{
            color: white;
            text-transform: uppercase;
        }
        .newele{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin: 10px 0px;
        }
        .newele input,label,button {
            /* flex: 0 0 4.5%; */
            margin: 0px 5px;
            font-size: 20px;
        }
        .clbtn{
            border-radius: 50%;
            border: none;
            cursor: pointer;
            text-align: center;
        }
        .box1{
          background-color: white;
            width: 75%;
            margin: 10px auto;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }
    </style>
    <div class="opti">
    <h1>Form Crafter</h1>
    <select name="Form" id="form" >
        <option value="">Choose </option>
        <option value="text">Text</option>
        <option value="number">Number</option>
        <option value="email">Email</option>
        <option value="checkbox">Checkbox</option>
        <option value="radio">Radio</option>
        <option value="select">Select</option>
        <option value="submit">Submit</option>
    </select>
    <button onclick="fun2()">Click</button>
    <p style="color: white;">Please choose the option from the above available options</p>
    </div>
    
    <div class="box">
        <h3>create your form</h3>
        <!-- <label for=""></label>
        <input type="" name="" id=""> -->
    </div>
    <form ></form>
    <script>

        function fun2(){
            let box=document.querySelector(".box");
            let sel=document.querySelector("#form").value;
            // let form=document.createElement("div")
            let form=document.querySelector("form");
            form.classList.add("box1")
            let labelInput = document.createElement("input");
            labelInput.type = "text";
            labelInput.placeholder = "Enter label";
            let container = document.createElement("div");
            container.classList.add("newele");
            let btn = document.createElement("button");
            btn.innerHTML = "Done";
            let closeButton = document.createElement("button");
            closeButton.innerHTML = "&times;";
            closeButton.classList.add("clbtn");
            closeButton.addEventListener("click", () => container.remove());
            if(!sel){
                alert("Please select the options");
                return;
            }
            if(sel == "text" || sel == "number" || sel == "email"){
              let newInput=document.createElement("input")
              newInput.type=sel;
              newInput.placeholder=sel;
              container.append(labelInput,btn,newInput,closeButton)
              box.append(container)
              btn.addEventListener("click",()=>{
                let newlab=document.createElement("label")
                newlab.innerHTML=`${labelInput.value}:`;
                if(!labelInput.value){
                  alert("Enter the Label");
                  return
                }
                container.append(newlab,newInput,closeButton)
                box.append(container)
                labelInput.remove();
                btn.remove();
              })  
            } else if(sel === "checkbox" || sel === "radio"){
              let optionsDiv = document.createElement("div");
              let opt=document.createElement("input")
              opt.type="text"
              opt.innerHTML="Enter value"
              let optLabel=document.createElement("label")
              let addOpt = document.createElement("button");
              addOpt.innerHTML = "Add";
              let dnOpt= document.createElement("button")
              dnOpt.innerHTML="Done"
              container.append(labelInput,btn,opt,addOpt,dnOpt,closeButton)
              box.append(container)

              btn.addEventListener("click",()=>{
                let newlab=document.createElement("label")
                newlab.innerHTML=`${labelInput.value}:`;
                if(!labelInput.value){
                  alert("Enter the Label");
                  return
                }
                container.append(newlab,opt,addOpt,dnOpt,closeButton)
                box.append(container)
                labelInput.remove();
                btn.remove();
              })  
              addOpt.addEventListener("click",()=>{
                let val=opt.value.trim();
                if(!val){
                  alert ("Enter the options for the input")
                  return
                }
                let inp = document.createElement("input");
                inp.type = sel;
                inp.value = val;
                inp.name = labelInput.value;

                let lbl = document.createElement("label");
                lbl.innerHTML = val;

                optionsDiv.append(inp,lbl)
                // container.append(optionsDiv)
                box.append(container,optionsDiv)
                opt.value = "";
              })
              dnOpt.addEventListener("click",()=>{
                let inp = document.createElement("input");
                container.append(optionsDiv,opt,closeButton)
                box.append(container)
                dnOpt.remove();
                addOpt.remove();
                opt.remove();
              })
            }else if(sel === "select"){
              let select=document.createElement("select");
              let optionsDiv = document.createElement("div");

              let opt = document.createElement("input");
              opt.type = "text";
              opt.placeholder = "Enter option";

              let addOpt = document.createElement("button");
              addOpt.innerHTML = "Add";
              let dnOpt= document.createElement("button")
              dnOpt.innerHTML="Done"

              container.append(labelInput,btn,opt,addOpt,dnOpt,select,closeButton)
              box.append(container)

              btn.addEventListener("click",()=>{
                let newlab=document.createElement("label")
                newlab.innerHTML=`${labelInput.value}:`;
                if(!labelInput.value){
                  alert("Enter the Label");
                  return
                }
                container.append(newlab,opt,addOpt,dnOpt,select,closeButton)
                box.append(container)
                labelInput.remove();
                btn.remove();
              })  
              addOpt.addEventListener("click",()=>{
                let val=opt.value.trim();
                if(!val){
                  alert ("Enter the options for the select dropdown")
                  return
                }
                let option = document.createElement("option");
                option.value = val;
                option.innerHTML = val;

                select.append(option)
                opt.value = "";
              })
              dnOpt.addEventListener("click",()=>{
                container.append(select,closeButton)
                box.append(container)
                dnOpt.remove();
                addOpt.remove();
                opt.remove();
              })
            }else if(sel==="submit"){
              let sub=document.createElement("input")
              sub.type="submit";
              sub.value="Submit"
              container.append(sub,closeButton)
              box.append(container)
              
              
              sub.addEventListener("click",()=>{
                 let confirmed = confirm("Form created! Do you want to view the empty form?");
                if(confirmed){
                  displayEmptyForm();
                }                
              });
            }
        }
        function displayEmptyForm(){
          // let box=document.querySelector(".box");
          let created=document.querySelector(".box")
          let form=document.querySelector("form");
          // let forminp=[];
         form.innerHTML=created.innerHTML;
         
         form.querySelectorAll(".clbtn").forEach(btn=>btn.remove());
         form.querySelectorAll("input, select, button").forEach(el => {
        if (el.type !== "submit") el.disabled = false;
         });
         let heading = form.querySelector("h3");
         heading.innerHTML="Fill Out Your Form";
        created.style.display = "none";
        document.querySelector(".opti").style.display = "none";
        form.style.display = "block";


        form.onsubmit = function (e) {
        e.preventDefault();

        let result = document.createElement("div");
        result.classList.add("box");
        result.style.backgroundColor = "darkblue";
        result.style.color = "white";

        let title = document.createElement("h3");
        title.innerHTML = "Data Submitted";
        result.appendChild(title);

        
        const fields = form.querySelectorAll(".newele");
        let label="";
        fields.forEach(field => {
            labelEl =  field.querySelector("label");
            if(!labelEl) return;
            let label= labelEl.innerHTML//labelEl ? labelEl.innerHTML : "No Label"; 
            let inputs = field.querySelectorAll("input, select");

            inputs.forEach(el=>{
            if (el.type === "submit") return;
            let value = "";
            if (el.type === "checkbox" || el.type === "radio") {
                if (!el.checked) return; 
                value = el.value;
            } else {
                value = el.value;
            }
            if (value) {
                const entry = document.createElement("p");
                entry.innerHTML = `${label} ${value}`;
                result.appendChild(entry);
            }
            })
        })
        form.replaceWith(result);
      }
    }
    </script>
</body>
</html>
