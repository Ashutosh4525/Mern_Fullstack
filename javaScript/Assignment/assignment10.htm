<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background-color: aliceblue;
            font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }
        .whole{
            
            box-shadow: 0px 0px 20px -20px;
            margin: 100px 50px;
            background-color: white;
        }
        .whole h1, p,label{
            margin: 5px 0px;
            padding: 10px 50px;
            padding-bottom: 10px; 
        }
        input{
            margin: 10px 0px;
            margin-left: 50px;
            padding: 5px ;
        }
        span{
            color: rgb(255, 0, 0);
        }

    </style>
    <div class="whole">
        <h1>Arts & Craft Fair Application</h1>
        <p>Fill the form below keenly to participate in the Art and Fair exhibition. Forms that are not completly filled will not be accepted.</p>
        <hr>
    <form novalidate onclick="return validate()">
        <label for="name">Full Name <span>*</span></label>
        <div>
            <input type="text"  id="firstname">
           
            <input type="text"  id="lastname">
        </div>

         <label for="name">Company Name <span>*</span></label>
        <div>
            <input type="text"  id="companyname"> 
        </div>
        
    </form>
    </div>
</body>
</html>
